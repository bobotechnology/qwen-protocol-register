[package]
name = "qwen-protocol-register"
version = "0.1.0"
edition = "2024"
description = "Rust protocol registration pipeline and offline fixture inspector"
license = "MIT"

[lib]
name = "qwen_protocol_register"
path = "src/lib.rs"

[[bin]]
name = "qwen-protocol-register"
path = "src/main.rs"

[dependencies]
aes = "0.8"
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["png"] }
imageproc = { version = "0.27", default-features = false }
percent-encoding = "2"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "charset", "deflate", "gzip", "rustls-tls", "socks"] }
rquickjs = { version = "0.14", features = ["array-buffer", "full-async"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
swc_common = "27"
swc_ecma_ast = "30"
swc_ecma_codegen = "33"
swc_ecma_parser = "47"
swc_ecma_visit = "30"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
